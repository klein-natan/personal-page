<!doctype html>
<html lang="pt-BR" data-title-pt="{{titlePt}}" data-title-en="{{titleEn}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titlePt}}</title>
  <script>
    // Aplica o idioma antes de desenhar a página, para não piscar no idioma errado.
    (function () {
      var l = null;
      try { l = localStorage.getItem('lang'); } catch (e) {}
      if (l !== 'pt' && l !== 'en') l = /^pt/i.test(navigator.language || 'pt') ? 'pt' : 'en';
      var h = document.documentElement;
      h.lang = l === 'en' ? 'en' : 'pt-BR';
      document.title = l === 'en' ? h.getAttribute('data-title-en') : h.getAttribute('data-title-pt');
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (t === 'dark') h.setAttribute('data-theme', 'dark');
    })();
  </script>
  <meta name="description" content="{{description}}">
  <link rel="canonical" href="{{canonical}}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{titlePt}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:url" content="{{canonical}}">
  <meta property="og:image" content="{{ogImage}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#F6F2ED">
  <link rel="icon" href="{{root}}assets/img/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/atom+xml" title="{{site.name}}" href="{{root}}feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400&family=Inter:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
  <link rel="stylesheet" href="{{root}}assets/css/style.css">
  <script src="{{root}}assets/js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main"><span data-lang="pt">Pular para o conteúdo</span><span data-lang="en">Skip to content</span></a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="{{root}}index.html">Natan Klein</a>

      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="nav-toggle-bars" aria-hidden="true"></span>
        <span data-lang="pt">Menu</span><span data-lang="en">Menu</span>
      </button>

      <nav id="site-nav" class="site-nav" aria-label="Principal">
        <ul>{{nav}}</ul>
        <div class="nav-actions">
          <a class="btn btn-small" href="{{root}}cv.html">CV</a>
          <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="sr-only"><span data-lang="pt">Modo escuro</span><span data-lang="en">Dark mode</span></span>
          </button>
          <button class="lang-toggle" type="button" data-lang-toggle>
            <span data-lang="pt" aria-hidden="true"><b>PT</b> / EN</span>
            <span data-lang="en" aria-hidden="true">PT / <b>EN</b></span>
          </button>
        </div>
      </nav>
    </div>
  </header>

  <main id="main" class="container">
{{content}}
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p class="footer-name">Natan Klein</p>
      <ul class="footer-links">
        <li><a href="mailto:{{site.email}}">E-mail</a></li>
        <li><a href="{{site.links.linkedin}}">LinkedIn</a></li>
        <li><a href="{{site.links.github}}">GitHub</a></li>
        <li><a href="{{site.links.instagram}}">Instagram</a></li>
        <li><a href="{{site.links.lattes}}">Lattes</a></li>
        <li><a href="{{site.links.orcid}}">ORCID</a></li>
        <li><a href="{{root}}feed.xml">RSS</a></li>
      </ul>
      <p class="footer-note">© {{year}} Natan Klein · <span data-lang="pt">Psicólogo</span><span data-lang="en">Psychologist</span> CRP {{site.crp}} · Passo Fundo, RS</p>
    </div>
  </footer>
</body>
</html>
